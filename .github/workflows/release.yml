name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          NPM_CONFIG_CAFILE: ""
        run: npm ci

      - name: Release check
        env:
          NPM_CONFIG_CAFILE: ""
        run: npm run release:check

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: tctidier-vsix-${{ github.ref_name }}
          path: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/') && secrets.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $vsix = (Get-ChildItem *.vsix | Select-Object -First 1).FullName
          npx vsce publish --packagePath $vsix --pat $env:VSCE_PAT --skip-duplicate

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/') && secrets.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          $vsix = (Get-ChildItem *.vsix | Select-Object -First 1).FullName
          npx ovsx publish --packagePath $vsix -p $env:OVSX_PAT --skip-duplicate

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

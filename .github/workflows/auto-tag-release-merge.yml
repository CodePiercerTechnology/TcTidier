name: Auto Tag Release Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: auto-tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create release tag from package version
        id: create_tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Derived invalid release tag: $tag"
            exit 1
          fi

          git fetch --tags origin

          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" "$MERGE_SHA" -m "Release $tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow for new tag
        if: steps.create_tag.outputs.created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.create_tag.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: context.payload.pull_request.base.ref,
              inputs: {
                tag_name: process.env.RELEASE_TAG,
                publish_marketplace: 'true',
                publish_openvsx: 'true',
                publish_github_release: 'true'
              }
            });

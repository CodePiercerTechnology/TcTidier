name: Validate GitFlow PR policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate GitFlow PR policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source and target branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" == release/* || "$HEAD_REF" == hotfix/* ]]; then
              exit 0
            fi

            echo "PRs into main must come from release/* or hotfix/* branches."
            exit 1
          fi

          if [[ "$BASE_REF" == "develop" ]]; then
            if [[ "$HEAD_REF" == feature/* || "$HEAD_REF" == release/* || "$HEAD_REF" == hotfix/* || "$HEAD_REF" == "main" ]]; then
              exit 0
            fi

            echo "PRs into develop must come from feature/*, release/*, hotfix/*, or main."
            exit 1
          fi

          echo "Unsupported base branch: $BASE_REF"
          exit 1
